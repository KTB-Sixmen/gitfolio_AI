services:
  ai:
    platform: linux/amd64
    image: 727646500036.dkr.ecr.ap-northeast-2.amazonaws.com/gitfolio/ai:dev
    container_name: gitfolio_ai
    ports:
      - target: 8000
        published: 80
        protocol: tcp
      - target: 8000
        published: 443
        protocol: tcp
    env_file:
      - .env
    networks:
      - ai

networks:
  ai:
    driver: overlay
    attachable: true