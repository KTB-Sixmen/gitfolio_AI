name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - feature/ai-cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract Docker credentials
        run: |
          echo "${{ secrets.ENV }}" > .env
          source .env
          echo "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}" >> $GITHUB_ENV
          echo "DOCKERHUB_PASSWORD=${DOCKERHUB_PASSWORD}" >> $GITHUB_ENV
          echo "DOCKER_REPO=${DOCKER_REPO}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ env.DOCKERHUB_PASSWORD }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}
          ecr: false

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_REPO }}:dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set AWS Credentials
        run: |
          echo "${{ secrets.ENV }}" > .env
          source .env
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Service,Values=ai" \
              "Name=tag:Name,Values=Gitfolio AI" \
              "Name=tag:Environment,Values=dev" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "No matching EC2 instance found!"
            exit 1
          fi
          echo "Found instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Deploy to EC2 using SSM
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
          DOCKER_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ env.DOCKERHUB_PASSWORD }}
          DOCKER_REPO: ${{ env.DOCKER_REPO }}
        run:
          # ENV 내용을 base64로 인코딩
          ENCODED_ENV=$(echo "$ENV_CONTENT" | base64)
          
          # 한 줄로 명령어 구성
          COMMAND='sudo -i && mkdir -p /home/ec2-user && echo "'$ENCODED_ENV'" | base64 -d > /home/ec2-user/.env && chmod 600 /home/ec2-user/.env && chown ec2-user:ec2-user /home/ec2-user/.env && docker login -u "'$DOCKER_USERNAME'" -p "'$DOCKER_PASSWORD'" && docker pull '$DOCKER_REPO':dev && docker stop fastapi-app || true && docker rm fastapi-app || true && docker run -d --name fastapi-app -p 8000:8000 --env-file /home/ec2-user/.env --network gitfolio-network --restart unless-stopped '$DOCKER_REPO':dev'
          
          # AWS SSM 명령어 실행
          aws ssm start-session \
            --target "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-StartInteractiveCommand" \
            --parameters "{\"command\":[\"$COMMAND\"]}"