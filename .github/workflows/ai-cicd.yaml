name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - feature/ai-cicd  # dev 브랜치에 푸시될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64  # EC2 호환성을 위한 플랫폼 지정
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:dev  # dev 태그만 사용

  deploy:
    needs: build  # build 작업 완료 후 실행
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to EC2
        # **변경된 부분: `appleboy/ssh-action@v0.1.4`에서 `@master`로 변경** 버전 호환성땜에 오류남
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 최신 dev 이미지 풀
            docker pull ${{ secrets.DOCKER_REPO }}:dev
            
            # 기존 컨테이너 중지 및 제거
            docker stop fastapi-app || true
            docker rm fastapi-app || true
            
            # 새 컨테이너 실행
            docker run -d \
              --name fastapi-app \
              -p 8000:8000 \
              -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e HOST=0.0.0.0 \  
              -e PORT=8000 \     
              ${{ secrets.DOCKER_REPO }}:dev