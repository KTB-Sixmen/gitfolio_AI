name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - feature/ai-cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          ecr: false

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get EC2 instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Service,Values=ai" \
              "Name=tag:Name,Values=Gitfolio AI" \
              "Name=tag:Environment,Values=dev" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "No matching EC2 instance found!"
            exit 1
          fi
          echo "Found instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Create env file
        run: |
          cat << EOF > .env
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN=${{ secrets.GH_TOKEN }}
          HOST=${{ secrets.HOST }}
          PORT=${{ secrets.PORT }}
          EOF

      - name: Deploy to EC2 using SSM
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
        run: |
          # 배포 스크립트 생성
          cat << EOF > deploy.sh
          #!/bin/bash
          set -e
          
          # 필요한 디렉토리 생성
          sudo mkdir -p /home/ec2-user
          
          # ENV 파일 생성 및 권한 설정
          echo "$ENCODED_ENV" | base64 -d > /home/ec2-user/.env
          sudo chmod 600 /home/ec2-user/.env
          sudo chown ec2-user:ec2-user /home/ec2-user/.env
          
          # Docker 로그인
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          
          # 이미지 풀
          docker pull $DOCKER_REPO:dev
          
          # 기존 컨테이너 정리
          docker stop fastapi-app || true
          docker rm fastapi-app || true
          
          # 새 컨테이너 실행
          docker run -d \
            --name fastapi-app \
            -p 8000:8000 \
            --env-file /home/ec2-user/.env \
            --network gitfolio-network \
            --restart unless-stopped \
            $DOCKER_REPO:dev
          EOF
          
          # 스크립트에 실행 권한 부여
          chmod +x deploy.sh
          
          # ENV 파일을 base64로 인코딩
          ENCODED_ENV=$(cat .env | base64 -w 0)
          
          # 배포 명령어 JSON 생성
          cat << EOF > command.json
          {
            "command": [
              "ENCODED_ENV='${ENCODED_ENV}' DOCKER_USERNAME='${DOCKER_USERNAME}' DOCKER_PASSWORD='${DOCKER_PASSWORD}' DOCKER_REPO='${DOCKER_REPO}' bash -c 'curl -sfL https://raw.githubusercontent.com/yourusername/yourrepo/feature/ai-cicd/deploy.sh | bash'"
            ]
          }
          EOF
          
          # AWS SSM 세션 시작 및 배포 실행
          aws ssm start-session \
            --target "${{ steps.get-instance.outputs.instance_id }}" \
            --document-name "AWS-StartInteractiveCommand" \
            --parameters "file://command.json"

      - name: Verify Deployment
        run: |
          echo "Waiting for application to start..."
          sleep 30
          
          # EC2 인스턴스의 퍼블릭 IP 가져오기
          EC2_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ steps.get-instance.outputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          # 헬스체크 수행
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s "http://$EC2_IP:8000/health" | grep -q "ok"; then
              echo "Application successfully deployed and healthy!"
              exit 0
            fi
          
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "Deployment verification failed after $MAX_RETRIES attempts"
          exit 1